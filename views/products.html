<header class="site-header">
  <div class="container nav">
    <a class="brand" href="/">Spark <span>Corner</span></a>
    <nav><a class="active" href="/products">Shop</a><a href="/#about">About</a><a href="/#contact">Contact</a><a class="cart-link" href="/cart">Cart</a></nav>
  </div>
</header>

<main class="container section">
  <div class="page-title">
    <p class="eyebrow">Beauty · skincare · jewellery</p>
    <h1>Find your next favourite.</h1>
    <p class="page-intro">Discover beauty essentials, skincare rituals, and jewellery made for every look.</p>
  </div>

  <form class="search-bar" method="GET" action="/products">
    <input name="q" value="{{SEARCH}}" placeholder="Search products...">
    <input name="min_price" value="{{MIN_PRICE}}" type="number" min="0" placeholder="Min ৳">
    <input name="max_price" value="{{MAX_PRICE}}" type="number" min="0" placeholder="Max ৳">
    <input name="skin_concern" value="{{SKIN_CONCERN}}" placeholder="Skin concern">
    <input name="material" value="{{MATERIAL}}" placeholder="Material">
    <input name="design" value="{{DESIGN}}" placeholder="Shade / design">
    <button class="btn" type="submit">Search</button>
  </form>

  <div class="category-links">
    <a href="/products">All</a>
    {{CATEGORIES}}
  </div>

  <div class="product-grid">{{PRODUCTS}}</div>

{{PAGINATION}}
</main>

<footer><div class="container">© Spark Corner</div></footer>
